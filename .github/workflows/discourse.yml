name: Discourse theme and book service
on:
  push:
    branches: [main]
    paths: ["about.json", "settings.yml", "javascripts/**", "common/**", "locales/**", "service/**", "spec/**", "test/**", ".github/workflows/discourse.yml"]
  pull_request:
    paths: ["about.json", "settings.yml", "javascripts/**", "common/**", "locales/**", "service/**", "spec/**", "test/**", ".github/workflows/discourse.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: discourse-zlibrary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forum:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: discourse/discourse_test:release
    defaults:
      run:
        shell: bash
    env:
      RAILS_ENV: test
      EMBER_ENV: development
      PGUSER: discourse
      PGPASSWORD: discourse
      PLAYWRIGHT_BROWSERS_PATH: /home/discourse/.cache/ms-playwright
      CAPYBARA_DEFAULT_MAX_WAIT_TIME: "20"
    steps:
      - run: chown root:root .
      - name: Check out Discourse v2026.10.2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: discourse/discourse
          ref: fb51a71e2e1422fd0cf7e59c5cbbaf60f719e1f9
          persist-credentials: false
      - name: Check out the remote theme component
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: themes/discourse-zlibrary
          persist-credentials: false
      - name: Prepare Discourse
        run: |
          redis-server /etc/redis/redis.conf --daemonize yes --logfile ""
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE discourse LOGIN SUPERUSER PASSWORD 'discourse';"
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without development
          bundle check || bundle install --jobs 4 --retry 1
          pnpm install --frozen-lockfile
          bin/rake db:create db:migrate
      - name: Test the book service
        run: |
          node --test themes/discourse-zlibrary/test/worker.test.mjs
          bin/rake assets:precompile:asset_processor assets:precompile:pretty_text
      - name: Build the forum UI and test the browser download
        run: |
          pnpm playwright-install
          DISCOURSE_DOWNLOAD_PRE_BUILT_ASSETS=1 script/assemble_ember_build.rb
          pnpm deploy --filter @discourse/playwright-runner --prod tmp/playwright
          export PLAYWRIGHT_CLI_EXECUTABLE_PATH="$PWD/tmp/playwright/node_modules/.bin/playwright"
          export NODE_PATH="$PWD/tmp/playwright/node_modules"
          bundle exec rspec themes/discourse-zlibrary/spec/system
