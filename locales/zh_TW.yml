      verification: 書庫服務要求額外驗證或傳回登入頁，請聯絡管理員。
      upstream: 書庫服務暫時無法完成這次請求。
      timeout: 書庫服務回應逾時，請稍後再試。
      unavailable: 這個版本目前無法下載。
      quota: 共用帳號的下載額度已用盡，請在額度恢復後再試。
      rate_limited: 書庫服務目前限制請求頻率，請稍後再試。
      too_large: 這個檔案超過 %{limit} MiB 的下載上限。
      incomplete: 檔案傳輸不完整，請稍後再試。
      selection: 這次選擇已過期或屬於其他會員，請重新搜尋並選擇版本。
      query: 搜尋詞須為 1 至 200 個字元，請確認格式、頁碼及站點編號均有效。
      membership: 請登入論壇後再試。
      file_host: 書庫服務尚未設定這個檔案網域。
      pending: 論壇尚未回覆，請在個人訊息中查看此次請求。
      attachment: 論壇無法為這個檔案類型或大小建立附件。
    pm_title: 書庫請求
    prepare: 準備下載
    embed: 在本帖嵌入 EPUB
    embedding: 正在準備論壇附件…
    local_file: 選取已下載的 EPUB
    select_local: 供應端要求由瀏覽器下載。請先下載所選版本，再於此選取該 EPUB。
    embed_limit: 檔案超過論壇允許的附件大小。
    invalid_epub: 請選取所選版本完整的 EPUB 檔案。
    other_draft: 請先完成其他話題已開啟的草稿，再於此嵌入。
